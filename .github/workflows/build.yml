name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Unduh sherpa-onnx AAR (suara ke teks offline)
        run: |
          mkdir -p app/libs
          curl -fL --retry 3 -o app/libs/sherpa-onnx.aar https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.7/sherpa-onnx-1.13.7.aar
          ls -lh app/libs
      - name: Bangun mesin terjemahan NLLB-200 (CTranslate2, arm64)
        # Tidak fatal: bila gagal, APK tetap dibangun dan opsi NLLB ditandai "tidak tersedia" di aplikasi.
        continue-on-error: true
        run: |
          set -o pipefail
          bash native/build_nllb.sh 2>&1 | tee nllb-build.log
      - name: Simpan log build NLLB
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nllb-build-log
          path: nllb-build.log
          if-no-files-found: ignore
      - run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Alethra-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: Alethra v1.${{ github.run_number }}
          files: app/build/outputs/apk/debug/app-debug.apk
