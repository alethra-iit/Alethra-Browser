<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Alethra</title>
<style>
:root{--bg:#fff;--surf:#f4f4f6;--fg:#111113;--sub:#6b6b73;--line:#e8e8ec}
:root[data-theme=dark]{--bg:#0b0b0d;--surf:#17171a;--fg:#f4f4f5;--sub:#8e8e96;--line:#26262a}
:root[data-theme=dark][data-amoled]{--bg:#000;--surf:#121214;--line:#1e1e21}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,sans-serif}
body{min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:8px 24px 32px}
svg{fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.top{width:100%;max-width:520px;display:flex;justify-content:flex-end}
.gear{width:44px;height:44px;border:0;background:none;color:var(--sub);display:flex;align-items:center;justify-content:center;padding:0}
.gear svg{width:22px;height:22px}
.hero{margin-top:9vh;text-align:center}
.hero svg.logo{width:72px;height:72px;stroke-width:2.4;color:var(--acc,var(--fg))}
.hero h1{margin:10px 0 4px;font-size:34px;font-weight:700;letter-spacing:-.5px}
.hero p{margin:0;color:var(--sub);font-size:15px}
form:focus-within{box-shadow:0 0 0 2px var(--acc,var(--line))}
form{width:100%;max-width:520px;margin-top:32px;display:flex;align-items:center;background:var(--surf);border-radius:26px;padding:0 8px 0 18px;min-height:52px}
form svg{width:20px;height:20px;color:var(--sub);flex:none}
input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:var(--fg);font-size:15px;padding:15px 12px}
input::placeholder{color:var(--sub)}
#mic{border:0;background:none;color:var(--sub);width:40px;height:40px;padding:0;display:flex;align-items:center;justify-content:center}
.grid{width:100%;max-width:520px;margin-top:36px;display:grid;grid-template-columns:repeat(3,1fr);gap:22px 12px}
.tile{display:flex;flex-direction:column;align-items:center;gap:8px}
.ic{width:56px;height:56px;border-radius:16px;background:var(--surf);display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:600;overflow:hidden}
.ic img{width:30px;height:30px}
.ic svg{width:24px;height:24px;color:var(--fg)}
.lb{font-size:12px;color:var(--fg);max-width:90px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style></head><body>
<div class="top"><button class="gear" id="gear" aria-label="Pengaturan"><svg viewBox="0 0 24 24"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg></button></div>
<div class="hero">
<svg class="logo" viewBox="0 0 24 24"><path d="M4 21L12 3l8 18"/><path d="M8.2 15h7.6"/></svg>
<h1>Alethra</h1><p>Jelajahi lebih jauh.</p></div>
<form id="f"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.3-4.3"/></svg>
<input id="q" placeholder="Cari atau masukkan alamat web" autocomplete="off" autocapitalize="off" enterkeyhint="go">
<button type="button" id="mic" aria-label="Cari dengan suara"><svg viewBox="0 0 24 24" style="width:20px;height:20px"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><path d="M12 19v3"/></svg></button></form>
<div class="grid" id="grid"></div>
<script>
var R=document.documentElement;
function apply(){
  var P=new URLSearchParams(location.hash.slice(1)),t=P.get('t');
  if(t==='dark'||(!t&&matchMedia('(prefers-color-scheme:dark)').matches))R.setAttribute('data-theme','dark');else R.removeAttribute('data-theme');
  if(P.get('o')==='1')R.setAttribute('data-amoled','1');else R.removeAttribute('data-amoled');
  var a=P.get('a'),okA=a&&/^#[0-9a-f]{6}$/i.test(a);
  if(okA)R.style.setProperty('--acc',a);else R.style.removeProperty('--acc');
  document.querySelector('.hero').style.display=P.get('l')==='0'?'none':'';
  var wv=P.get('w');
  if(wv&&wv!=='0'){var dd=[.2,.4,.62][parseInt(P.get('d')||'1',10)]||.4;var ov=R.getAttribute('data-theme')==='dark'?'rgba(0,0,0,'+dd+')':'rgba(255,255,255,'+dd+')';var b=document.body.style;b.backgroundImage='linear-gradient('+ov+','+ov+'),url(https://alethra.wall/w.jpg?v='+wv+')';b.backgroundSize='cover';b.backgroundPosition='center';b.backgroundAttachment='fixed';b.backgroundRepeat='no-repeat'}
  else if(P.get('g')==='1'){var c=okA?a:(R.getAttribute('data-theme')==='dark'?'#ffffff':'#000000');var cc='rgba('+parseInt(c.substr(1,2),16)+','+parseInt(c.substr(3,2),16)+','+parseInt(c.substr(5,2),16);document.body.style.backgroundImage='linear-gradient(180deg,'+cc+',.2),'+cc+',0) 60%)';document.body.style.backgroundRepeat='no-repeat'}else document.body.style.backgroundImage='none';
  var s=[];try{s=JSON.parse(P.get('s')||'[]')}catch(e){}
  var g=document.getElementById('grid');g.innerHTML='';
  s.forEach(function(x,i){
    var d=document.createElement('div');d.className='tile';
    var ic=document.createElement('div');ic.className='ic';
    var host='';try{host=new URL(x.u).hostname}catch(e){}
    var l=document.createElement('span');l.textContent=(x.n||host||'?').charAt(0).toUpperCase();ic.appendChild(l);
    var im=new Image();im.onload=function(){l.style.display='none';ic.appendChild(im)};
    if(host)im.src='https://www.google.com/s2/favicons?domain='+host+'&sz=64';
    var lb=document.createElement('div');lb.className='lb';lb.textContent=x.n||host;
    d.appendChild(ic);d.appendChild(lb);
    d.onclick=function(){location.href=x.u};
    d.oncontextmenu=function(e){e.preventDefault();location.href='alethra://delshortcut?i='+i};
    g.appendChild(d);
  });
  var a=document.createElement('div');a.className='tile';
  a.innerHTML='<div class="ic"><svg viewBox="0 0 24 24"><path d="M5 12h14"/><path d="M12 5v14"/></svg></div><div class="lb">Tambah</div>';
  a.onclick=function(){location.href='alethra://addshortcut'};
  g.appendChild(a);
}
apply();window.addEventListener('hashchange',apply);
document.getElementById('f').onsubmit=function(e){e.preventDefault();var v=document.getElementById('q').value.trim();if(v)location.href='alethra://go?q='+encodeURIComponent(v)};
document.getElementById('gear').onclick=function(){location.href='alethra://settings'};
document.getElementById('mic').onclick=function(){location.href='alethra://mic'};
</script></body></html>
